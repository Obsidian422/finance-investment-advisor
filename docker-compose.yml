# =============================================================================
# 多智能体金融投资助理 —— 一键起全栈
#
#   cp .env.example .env      # 填好 API_KEY
#   docker compose up --build
#
# 起来之后：
#   · FastAPI   http://localhost:9998
#   · Gradio    http://localhost:9996
#
# ⚠ 状态：尚未在 Docker 环境完成构建验证（开发机未安装 Docker）。
#   已完成静态核对：7 个 entrypoint 脚本路径均存在、源码端口与 healthcheck 端口
#   一致（7335/7336/7337/8335/8336/9330/9339）、compose YAML 合法、宿主端口无冲突。
#   首次 `docker compose up --build` 若与实际不符，按实际输出修正本文件。
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 7 个 MCP Server 同容器运行（原因见 Dockerfile 顶部注释：server_url 是单值）
  # ---------------------------------------------------------------------------
  mcp-servers:
    build: .
    image: finance-investment-advisor:local
    container_name: fia-mcp-servers
    env_file:
      - .env
    environment:
      # Server 自身不互相调用，只需要本机可达
      server_url: 127.0.0.1
    volumes:
      # 日志落到宿主机，排查方便（与裸机版 logs/ 布局一致）
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # FastAPI 多用户会话接口
  # server_url 指向 mcp-servers 服务名 —— compose 网络内按服务名解析
  # ---------------------------------------------------------------------------
  app:
    image: finance-investment-advisor:local
    container_name: fia-app
    depends_on:
      mcp-servers:
        condition: service_healthy
    env_file:
      - .env
    environment:
      server_url: mcp-servers
    ports:
      - "9998:9998"
    # 必须切到该目录再跑：chat_api.py 用 `from multi_user_..._with_session import *`
    command: ["bash", "-c", "cd /app/project2_finance_assistant && exec python chat_api.py"]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Gradio 前端
  # ---------------------------------------------------------------------------
  gradio:
    image: finance-investment-advisor:local
    container_name: fia-gradio
    depends_on:
      mcp-servers:
        condition: service_healthy
    env_file:
      - .env
    environment:
      server_url: mcp-servers
    ports:
      - "9996:9996"
    command: ["bash", "-c", "cd /app/project2_finance_assistant && exec python gradio_demo.py"]
    restart: unless-stopped